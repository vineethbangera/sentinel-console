# Opens pull requests when dependencies have new versions.
#
# Bastion (@vineethbangera/ui and @vineethbangera/tokens) is checked every
# day and upgraded in one pull request, so the components and the tokens
# they were built against move together. Dependabot reads .npmrc to find
# GitHub Packages and signs in with its own GITHUB_TOKEN, so there is no
# token to store here.
#
# Everything else (React, Vite, TypeScript) is grouped into one pull request
# for minor and patch versions. Major versions get their own pull request,
# because they may need code changes.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    groups:
      bastion:
        patterns:
          - "@vineethbangera/*"
      toolchain:
        patterns:
          - "*"
        exclude-patterns:
          - "@vineethbangera/*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
    labels:
      - dependencies
